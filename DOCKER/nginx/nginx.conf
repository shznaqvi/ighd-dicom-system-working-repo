server {
    listen 80;
    server_name dicom.yourdomain.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dicom.yourdomain.org;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # DICOM Viewer App (Port 8501)
    location / {
        proxy_pass http://dicom_browser_app:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Upload Server API (Port 8502)
    location /api/ {
        proxy_pass http://dicom_upload_server:8502/;
        proxy_set_header Host $host;
        client_max_body_size 500M; # Accommodates large DICOM batch ZIPs
    }

    # Upload Client UI (Port 8503)
    location /uploader/ {
        proxy_pass http://dicom_upload_client:8503/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}