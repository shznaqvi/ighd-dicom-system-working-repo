services:
  nginx_gateway:
    image: nginx:alpine
    container_name: nginx_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - shared_proxy_network

networks:
  shared_proxy_network:
    name: shared_proxy_network  # Forces predictable network name
    driver: bridge